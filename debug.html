<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🛠️ 秘密の管理・設定部屋 🛠️</title>
    <style>
        body {
            text-align: center;
            background-color: #111;
            color: #00ffcc;
            font-family: 'Arial', sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 30px auto;
            background: #222;
            padding: 25px;
            border: 2px dashed #00ffcc;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffde7d;
        }
        input, select {
            width: 100%;
            padding: 10px;
            background: #333;
            color: #fff;
            border: 1px solid #00ffcc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .btn-group {
            margin-top: 25px;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-save { background: #00ffcc; color: #000; }
        .btn-back { background: #555; color: #fff; }
        .info-text {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>🛠️ 秘密の管理・設定部屋 🛠️</h1>
    <p>イベントの事前設定を行います。</p>

    <div class="container">
        <!-- フォーム1：参加人数のアンケート -->
        <div class="form-group">
            <label for="player-count">👥 今回のイベントの参加予定人数は？</label>
            <input type="number" id="player-count" min="1" max="20" value="10" oninput="calculateRopes()">
            <p class="info-text">※人数と同じ本数の紐がゲーム画面に自動セットされます（最大20本）</p>
        </div>

        <!-- フォーム2：当選番号の仕込み（おまけ機能） -->
        <div class="form-group">
            <label for="cheat-number">🎯 次の人が引く当選番号を強制指定 (任意)：</label>
            <select id="cheat-number">
                <option value="random">-- 通常（ランダム） --</option>
            </select>
        </div>

        <div class="btn-group">
            <button class="btn btn-save" onclick="saveSettings()">設定を適用して保存する</button>
            <button class="btn btn-back" onclick="location.href='index.html'">受付へ戻る</button>
        </div>
    </div>

    <script>
        // ページ読み込み時に現在の設定を復元する
        window.onload = function() {
            const savedCount = localStorage.getItem('totalRopes') || 10;
            document.getElementById('player-count').value = savedCount;
            
            // 人数に合わせて当選番号の選択肢を自動生成
            calculateRopes();

            const savedCheat = localStorage.getItem('cheatTarget') || 'random';
            document.getElementById('cheat-number').value = savedCheat;
        };

        // 人数の入力に合わせて、仕込み番号のドロップダウンの選択肢を増減させる関数
        function calculateRopes() {
            const countInput = document.getElementById('player-count');
            let count = parseInt(countInput.value) || 10;

            // 画面が崩れないように最大20本に制限
            if (count > 20) { count = 20; countInput.value = 20; }
            if (count < 1) { count = 1; countInput.value = 1; }

            const cheatSelect = document.getElementById('cheat-number');
            const currentVal = cheatSelect.value;

            // 選択肢のクリアと再生成
            cheatSelect.innerHTML = '<option value="random">-- 通常（ランダム） --</option>';
            for (let i = 1; i <= count; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i}番`;
                cheatSelect.appendChild(opt);
            }

            // 以前の選択状態を維持できれば維持する
            if (parseInt(currentVal) <= count) {
                cheatSelect.value = currentVal;
            }
        }

        // ローカルストレージに設定データを保存する
        function saveSettings() {
            const count = document.getElementById('player-count').value;
            const cheat = document.getElementById('cheat-number').value;

            localStorage.setItem('totalRopes', count);
            localStorage.setItem('cheatTarget', cheat);

            alert(`設定を保存しました！\n・紐の本数: ${count}本\n・裏仕込み番号: ${cheat === 'random' ? 'なし' : cheat + '番'}`);
        }
    </script>
</body>
</html>
