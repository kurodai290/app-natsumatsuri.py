<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🏮 熱狂！お祭り千本引き 🏮</title>
    <style>
        body {
            text-align: center;
            background-color: #0b0c10;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ff3838;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #ff3838, 2px 2px 4px #000;
        }
        .sub-title {
            color: #ffb300;
            font-size: 18px;
            font-weight: bold;
            margin-top: 0;
        }
        #game-container {
            position: relative;
            width: 95%; /* 紐の本数が増えても収まるように横幅を柔軟に変更 */
            max-width: 1100px;
            height: 480px;
            background: radial-gradient(circle, #3a0505 0%, #140101 100%);
            border: 12px solid #d4af37;
            border-radius: 15px;
            margin: 20px auto;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        #top-curtain {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 70px;
            background: linear-gradient(180deg, #d32f2f 0%, #9a1f1f 100%);
            z-index: 10;
            border-bottom: 6px double #d4af37;
        }
        #bottom-curtain {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(0deg, #1e1e24 0%, #2a2b36 100%);
            z-index: 5;
            border-top: 6px solid #d4af37;
        }
        #rope-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            height: 100%;
            padding: 0 15px;
            box-sizing: border-box;
        }
        .rope-wrapper {
            position: relative;
            flex: 1; /* 本数に合わせて1本あたりの幅を自動調整 */
            max-width: 50px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rope {
            width: 6px;
            height: 300px;
            background: repeating-linear-gradient(45deg, #d32f2f, #d32f2f 10px, #fff 10px, #fff 20px);
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: top center;
            border-radius: 4px;
            z-index: 2;
        }
        .rope:hover { filter: brightness(1.3) drop-shadow(0 0 8px #ffb300); }
        .knot {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 30% 30%, #ffee55, #f57f17);
            border: 1px solid #d4af37;
            border-radius: 50%;
            position: absolute;
            top: 290px;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .pulled-rope, .pulled-knot { transform: translateY(-140px) !important; }
        .number-tag {
            position: absolute;
            bottom: -100px;
            width: 90%;
            max-width: 65px;
            height: 95px;
            background: linear-gradient(135deg, #fff9e6 0%, #e6ca65 100%);
            color: #2c0000;
            border: 3px solid #b8860b;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            box-sizing: border-box;
            transition: bottom 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .number-tag .title { font-size: 10px; font-weight: bold; color: #5c4033; }
        .number-tag .num { font-size: 28px; font-weight: 900; color: #aa0000; }
        .pulled-tag { bottom: 130px !important; }
        #result-display { font-size: 32px; font-weight: bold; color: #00ffcc; height: 50px; margin-top: 15px; }
        .btn-group { display: flex; justify-content: center; margin: 20px auto; }
        .control-btn { padding: 14px 35px; font-size: 20px; font-weight: bold; color: white; border: none; border-radius: 50px; cursor: pointer; display: none; }
        /* 🛠️ ボタンのデザインを「受付にもどる」用に調整 */
        #back-btn { background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%); box-shadow: 0 6px 12px rgba(0,0,0,0.3); }
        #back-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <h1>🏮 大当たり連動！電脳千本引き 🏮</h1>
    <p class="sub-title">狙いを定めて紐を引け！出た番号のリアル景品をプレゼント！</p>
    
    <div id="game-container">
        <div id="top-curtain"></div>
        <div id="rope-container"></div>
        <div id="bottom-curtain"></div>
    </div>

    <div id="result-display"></div>
    
    <div class="btn-group">
        <!-- 🛠️ 次の人ボタンを削除し、受付に戻るボタンのみに統合 -->
        <button id="back-btn" class="control-btn" onclick="goToGate()">受付にもどる</button>
    </div>

    <script>
        const ropeContainer = document.getElementById('rope-container');
        const resultDisplay = document.getElementById('result-display');
        const backBtn = document.getElementById('back-btn');

        let totalRopes = 10; // デフォルトは10本
        let hasPulled = false;

        function initGame() {
            ropeContainer.innerHTML = '';
            resultDisplay.textContent = '';
            backBtn.style.display = 'none';
            hasPulled = false;

            // デバッグ設定部屋から「設定された人数（紐の本数）」を読み込む
            const savedTotal = localStorage.getItem('totalRopes');
            if (savedTotal) {
                totalRopes = parseInt(savedTotal);
            }

            const numbers = [];
            for (let i = 1; i <= totalRopes; i++) {
                numbers.push(i);
            }

            // 番号のシャッフル
            const shuffledNumbers = numbers.sort(() => Math.random() - 0.5);
            const cheatTarget = localStorage.getItem('cheatTarget');

            for (let i = 0; i < totalRopes; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('rope-wrapper');

                const rope = document.createElement('div');
                rope.classList.add('rope');

                const knot = document.createElement('div');
                knot.classList.add('knot');

                const tag = document.createElement('div');
                tag.classList.add('number-tag');
                
                let selectedNumber = shuffledNumbers[i];
                tag.innerHTML = `<span class="title">第</span><span class="num" id="num-${i}">${selectedNumber}</span>`;

                wrapper.appendChild(tag);
                wrapper.appendChild(rope);
                wrapper.appendChild(knot);

                const pullEvent = () => {
                    if (hasPulled) return;
                    hasPulled = true;

                    // デバッグ仕込みがあった場合の判定
                    if (cheatTarget && cheatTarget !== 'random') {
                        selectedNumber = parseInt(cheatTarget);
                        document.getElementById(`num-${i}`).textContent = selectedNumber;
                        localStorage.removeItem('cheatTarget'); // 1回使ったらクリア
                    }

                    rope.classList.add('pulled-rope');
                    knot.classList.add('pulled-knot');
                    tag.classList.add('pulled-tag');

                    setTimeout(() => {
                        resultDisplay.textContent = `🎉 おめでとう！ 【${selectedNumber}番】 獲得！`;
                        backBtn.style.display = 'block'; // 🛠️ 受付にもどるボタンを表示
                    }, 600);
                };

                rope.addEventListener('click', pullEvent);
                knot.addEventListener('click', pullEvent);

                ropeContainer.appendChild(wrapper);
            }
        }

        function goToGate() {
            window.location.href = "index.html";
        }

        initGame();
    </script>
</body>
</html>
