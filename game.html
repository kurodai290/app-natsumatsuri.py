<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🏮 千本引き会場 🏮</title>
    <style>
        body {
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffde7d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin-bottom: 5px;
        }
        .sub-title {
            color: #2ed573;
            font-size: 18px;
            font-weight: bold;
            margin-top: 0;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background-color: #c0392b;
            border: 10px solid #f1c40f;
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #top-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #962d22;
            z-index: 10;
            border-bottom: 5px dashed #f1c40f;
        }
        #bottom-curtain {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-color: #2c3e50;
            z-index: 5;
            border-top: 5px solid #34495e;
        }
        #rope-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            height: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .rope-wrapper {
            position: relative;
            width: 40px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .rope {
            width: 6px;
            height: 280px;
            background: linear-gradient(90deg, #d7ccc8, #a1887f, #d7ccc8);
            cursor: pointer;
            transition: transform 0.5s ease-in-out;
            transform-origin: top center;
            border-radius: 3px;
            z-index: 2;
        }
        .rope:hover {
            background: linear-gradient(90deg, #ffeb3b, #f57f17, #ffeb3b);
        }
        .knot {
            width: 16px;
            height: 16px;
            background-color: #8d6e63;
            border-radius: 50%;
            position: absolute;
            top: 270px;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.5s ease-in-out;
        }
        .pulled-rope, .pulled-knot {
            transform: translateY(-130px);
        }
        .number-tag {
            position: absolute;
            bottom: -90px;
            width: 65px;
            height: 85px;
            background-color: #fff;
            color: #333;
            border: 4px solid #ff4757;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: bottom 0.5s ease-in-out;
            z-index: 1;
            box-sizing: border-box;
        }
        .number-tag .title {
            font-size: 10px;
            color: #777;
            font-weight: bold;
        }
        .number-tag .num {
            font-size: 32px;
            font-weight: bold;
            color: #d63031;
            line-height: 1;
            margin-top: 5px;
        }
        .pulled-tag {
            bottom: 120px; 
        }
        #result-display {
            font-size: 32px;
            font-weight: bold;
            color: #ffde7d;
            height: 45px;
            margin-top: 10px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px auto;
        }
        .control-btn {
            padding: 12px 30px;
            font-size: 18px;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
        }
        #reset-btn {
            background-color: #2ed573;
        }
        #reset-btn:hover {
            background-color: #26af5f;
        }
        #back-btn {
            background-color: #747d8c;
        }
        #back-btn:hover {
            background-color: #57606f;
        }
    </style>
</head>
<body>

    <h1>🏮 リアル連動！千本引きくじ 🏮</h1>
    <p class="sub-title">紐をひいて、出た番号の景品をもらおう！</p>
    
    <div id="game-container">
        <div id="top-curtain"></div>
        <div id="rope-container"></div>
        <div id="bottom-curtain"></div>
    </div>

    <div id="result-display"></div>
    
    <div class="btn-group">
        <button id="reset-btn" class="control-btn" onclick="initGame()">次の人がひく</button>
        <button id="back-btn" class="control-btn" onclick="goToGate()">受付にもどる</button>
    </div>

    <script>
        const ropeContainer = document.getElementById('rope-container');
        const resultDisplay = document.getElementById('result-display');
        const resetBtn = document.getElementById('reset-btn');
        const backBtn = document.getElementById('back-btn');

        const totalRopes = 10;
        let hasPulled = false;

        function initGame() {
            ropeContainer.innerHTML = '';
            resultDisplay.textContent = '';
            resetBtn.style.display = 'none';
            backBtn.style.display = 'none';
            hasPulled = false;

            const numbers = [];
            for (let i = 1; i <= totalRopes; i++) {
                numbers.push(i);
            }

            const shuffledNumbers = numbers.sort(() => Math.random() - 0.5);

            for (let i = 0; i < totalRopes; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('rope-wrapper');

                const rope = document.createElement('div');
                rope.classList.add('rope');

                const knot = document.createElement('div');
                knot.classList.add('knot');

                const tag = document.createElement('div');
                tag.classList.add('number-tag');
                
                const selectedNumber = shuffledNumbers[i];
                tag.innerHTML = `<span class="title">ばんごう</span><span class="num">${selectedNumber}</span>`;

                wrapper.appendChild(rope);
                wrapper.appendChild(knot);
                wrapper.appendChild(tag);
                ropeContainer.appendChild(wrapper);

                const pullAction = () => {
                    if (hasPulled) return;
                    hasPulled = true;

                    rope.classList.add('pulled-rope');
                    knot.classList.add('pulled-knot');
                    tag.classList.add('pulled-tag');

                    setTimeout(() => {
                        resultDisplay.innerHTML = `🎉 【 ${selectedNumber} 番 】 のお菓子をゲット！`;
                        resetBtn.style.display = 'inline-block';
                        backBtn.style.display = 'inline-block'; // 受付に戻るボタンも出す
                    }, 500);
                };

                rope.addEventListener('click', pullAction);
                knot.addEventListener('click', pullAction);
            }
        }

        // 受付画面（index.html）に戻る処理
        function goToGate() {
            window.location.href = "index.html";
        }

        // 初期起動
        initGame();
    </script>
</body>
</html>
