<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🏮 熱狂！お祭り千本引き 🏮</title>
    <style>
        /* 全体の背景をお祭りの夜市をイメージした深い和風の紺色に */
        body {
            text-align: center;
            background-color: #0b0c10;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* タイトルにネオンのような光のグラデーションを追加 */
        h1 {
            color: #ff3838;
            font-size: 36px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px #ff3838, 0 0 20px #ff4d4d, 2px 2px 4px #000;
        }

        .sub-title {
            color: #ffb300;
            font-size: 18px;
            font-weight: bold;
            margin-top: 0;
            text-shadow: 1px 1px 2px #000;
        }

        /* ゲーム画面の外枠を高級感のある木目・ゴールド仕様に */
        #game-container {
            position: relative;
            width: 850px;
            height: 480px;
            background: radial-gradient(circle, #3a0505 0%, #140101 100%); /* 奥を暗く立体的に */
            border: 12px solid #d4af37; /* ゴールドの太枠 */
            border-radius: 15px;
            margin: 20px auto;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.9);
        }

        /* 上の幕：お祭りの提灯や紅白幕をイメージしたデザイン */
        #top-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: linear-gradient(180deg, #d32f2f 0%, #9a1f1f 100%);
            z-index: 10;
            border-bottom: 6px double #d4af37;
            box-shadow: 0 5px 10px rgba(0,0,0,0.5);
        }

        /* 下の幕：和風の黒い格子・屋台のカウンターをイメージ */
        #bottom-curtain {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background: linear-gradient(0deg, #1e1e24 0%, #2a2b36 100%);
            z-index: 5;
            border-top: 6px solid #d4af37;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
        }

        #rope-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            height: 100%;
            padding: 0 25px;
            box-sizing: border-box;
        }

        .rope-wrapper {
            position: relative;
            width: 50px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 紐：しめ縄や太いお祭り用の紐をイメージした赤と白のグラデーション */
        .rope {
            width: 8px;
            height: 300px;
            background: repeating-linear-gradient(45deg, #d32f2f, #d32f2f 10px, #fff 10px, #fff 20px);
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: top center;
            border-radius: 4px;
            z-index: 2;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        /* ホバー時に紐が怪しく光るエフェクト */
        .rope:hover {
            filter: brightness(1.3) drop-shadow(0 0 8px #ffb300);
        }

        /* 紐の結び目：大きな金の鈴（すず）に変更！ */
        .knot {
            width: 24px;
            height: 24px;
            background: radial-gradient(circle at 30% 30%, #ffee55, #f57f17);
            border: 1px solid #d4af37;
            border-radius: 50%;
            position: absolute;
            top: 290px;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .pulled-rope, .pulled-knot {
            transform: translateY(-140px); /* 引き上げ幅を少し大きく */
        }

        /* 番号札：和風の木札・金ピカ仕様に変更 */
        .number-tag {
            position: absolute;
            bottom: -100px;
            width: 70px;
            height: 95px;
            background: linear-gradient(135deg, #fff9e6 0%, #e6ca65 100%);
            color: #2c0000;
            border: 3px solid #b8860b;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.6);
            transition: bottom 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 1;
            box-sizing: border-box;
        }

        .number-tag .title {
            font-size: 11px;
            color: #5c4033;
            font-weight: bold;
            letter-spacing: 2px;
            border-bottom: 1px solid #b8860b;
            padding-bottom: 2px;
        }

        .number-tag .num {
            font-size: 36px;
            font-weight: 900;
            color: #aa0000;
            line-height: 1;
            margin-top: 8px;
            text-shadow: 1px 1px 0px #fff;
        }

        .pulled-tag {
            bottom: 130px; 
        }

        /* 結果発表のテキスト表示エリア */
        #result-display {
            font-size: 36px;
            font-weight: bold;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc, 0 0 20px #00aa88;
            height: 50px;
            margin-top: 15px;
        }

        /* ボタングループ */
        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px auto;
        }

        .control-btn {
            padding: 14px 35px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            display: none;
            transition: all 0.2s;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        #reset-btn {
            background: linear-gradient(135deg, #2ed573 0%, #26af5f 100%);
        }

        #back-btn {
            background: linear-gradient(135deg, #57606f 0%, #2f3542 100%);
        }
    </style>
</head>
<body>

    <h1>🏮 大当たり連動！電脳千本引き 🏮</h1>
    <p class="sub-title">狙いを定めて紐を引け！出た番号のリアル景品をプレゼント！</p>
    
    <div id="game-container">
        <div id="top-curtain"></div>
        <div id="rope-container"></div>
        <div id="bottom-curtain"></div>
    </div>

    <div id="result-display"></div>
    
    <div class="btn-group">
        <button id="reset-btn" class="control-btn" onclick="initGame()">次の人がひく</button>
        <button id="back-btn" class="control-btn" onclick="goToGate()">受付にもどる</button>
    </div>

    <script>
        const ropeContainer = document.getElementById('rope-container');
        const resultDisplay = document.getElementById('result-display');
        const resetBtn = document.getElementById('reset-btn');
        const backBtn = document.getElementById('back-btn');

        const totalRopes = 10;
        let hasPulled = false;

        function initGame() {
            ropeContainer.innerHTML = '';
            resultDisplay.textContent = '';
            resetBtn.style.display = 'none';
            backBtn.style.display = 'none';
            hasPulled = false;

            const numbers = [];
            for (let i = 1; i <= totalRopes; i++) {
                numbers.push(i);
            }

            const shuffledNumbers = numbers.sort(() => Math.random() - 0.5);

            for (let i = 0; i < totalRopes; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('rope-wrapper');

                const rope = document.createElement('div');
                rope.classList.add('rope');

                const knot = document.createElement('div');
                knot.classList.add('knot');

                const tag = document.createElement('div');
                tag.classList.add('number-tag');
                
                const selectedNumber = shuffledNumbers[i];
                tag.innerHTML = `<span class="title">第</span><span class="num">${selectedNumber}</span>`;

                wrapper.appendChild(rope);
                wrapper.appendChild(knot);
                wrapper.appendChild(tag);
                ropeContainer.appendChild(wrapper);

                const pullAction = () => {
                    if (hasPulled) return;
                    hasPulled = true;

                    rope.classList.add('pulled-rope');
                    knot.classList.add('pulled-knot');
                    tag.classList.add('pulled-tag');

                    setTimeout(() => {
                        resultDisplay.innerHTML = `🌟 【 第 ${selectedNumber} 号 】 景品獲得！ 🌟`;
                        resetBtn.style.display = 'inline-block';
                        backBtn.style.display = 'inline-block';
                    }, 600); // アニメーション速度に合わせて少し遅延を変更
                };

                rope.addEventListener('click', pullAction);
                knot.addEventListener('click', pullAction);
            }
        }

        function goToGate() {
            window.location.href = "index.html";
        }

        initGame();
    </script>
</body>
</html>
