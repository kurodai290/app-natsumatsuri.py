<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🏮 お祭り千本引き・受付 🏮</title>
    <style>
        body {
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        #password-screen {
            max-width: 400px;
            margin: 100px auto;
            background-color: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            border: 5px solid #f1c40f;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #password-screen h2 {
            color: #ffde7d;
            margin-top: 0;
        }
        #password-input {
            width: 80%;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            text-align: center;
            margin-bottom: 20px;
        }
        .gate-btn {
            padding: 10px 25px;
            font-size: 18px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        .gate-btn:hover {
            background-color: #ff6b81;
        }
        #error-msg {
            color: #ff4757;
            font-weight: bold;
            margin-top: 15px;
            height: 20px;
        }

        /* 👁️ 完全ステルス設定 */
        #hidden-input {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 0px;
            height: 0px;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 完全ステルス化した隠し入力欄 -->
    <input type="text" id="hidden-input" name="secret_gate_code_random_99" autocomplete="off">

    <div id="password-screen">
        <h2>🏮 番台さんの部屋 🏮</h2>
        <p>合言葉を入力してゲームを始めてね！</p>
        <input type="text" id="password-input" placeholder="あいことばを入力" autocomplete="off">
        <br>
        <button class="gate-btn" onclick="checkPassword()">入室する</button>
        <div id="error-msg"></div>
    </div>

    <script>
        const CORRECT_PASSWORD1 = "なつまつり"; // 合言葉1
        const CORRECT_PASSWORD2 = "夏祭り";     // 合言葉2

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (input === CORRECT_PASSWORD1 || input === CORRECT_PASSWORD2) {
                window.location.href = "game.html";
            } else {
                errorMsg.textContent = "❌ 合言葉がちがうよ！";
                document.getElementById('password-input').value = "";
            }
        }

        // 一般パスワード用のエンターキー対応
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        /* 🛠️ 改善：タイピング時に毎回確実に隠しボックスへフォーカスを移す */
        window.addEventListener('keydown', function(e) {
            const activeEl = document.activeElement;
            const hiddenInput = document.getElementById('hidden-input');
            const mainInput = document.getElementById('password-input');

            // 中央の入力欄を触っていない時だけ、強制誘導
            if (activeEl !== mainInput) {
                hiddenInput.focus();
            }
        });

        // 🛠️ 隠しテキストボックスのEnter処理
        document.getElementById('hidden-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const cmd = this.value.trim().toLowerCase();
                
                if (cmd === "kurodai") {
                    window.location.href = "debug.html"; 
                }

                // 🔄 改善点：入力が終わったら中身を消し、フォーカスを一度外してリセットする
                this.value = ""; 
                this.blur(); 
            }
        });
    </script>
</body>
</html>
