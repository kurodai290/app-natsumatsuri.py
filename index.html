<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>🏮 お祭り千本引き・受付 🏮</title>
    <style>
        body {
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        #password-screen {
            max-width: 400px;
            margin: 100px auto;
            background-color: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            border: 5px solid #f1c40f;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        #password-screen h2 {
            color: #ffde7d;
            margin-top: 0;
        }
        #password-input {
            width: 80%;
            padding: 10px;
            font-size: 18px;
            border-radius: 5px;
            border: none;
            text-align: center;
            margin-bottom: 20px;
        }
        .gate-btn {
            padding: 10px 25px;
            font-size: 18px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
        }
        .gate-btn:hover {
            background-color: #ff6b81;
        }
        #error-msg {
            color: #ff4757;
            font-weight: bold;
            margin-top: 15px;
            height: 20px;
        }
    </style>
</head>
<body>

    <div id="password-screen">
        <h2>🏮 番台さんの部屋 🏮</h2>
        <p>合言葉を入力してゲームを始めてね！</p>
        <input type="text" id="password-input" placeholder="あいことばを入力">
        <br>
        <button class="gate-btn" onclick="checkPassword()">入室する</button>
        <div id="error-msg"></div>
    </div>

    <script>
        const CORRECT_PASSWORD = "おまつり"; // ★好きな合言葉に変更可能

        function checkPassword() {
            const input = document.getElementById('password-input').value;
            const errorMsg = document.getElementById('error-msg');

            if (input === CORRECT_PASSWORD) {
                // 合言葉が合っていたら、ゲーム画面（game.html）へ移動する
                window.location.href = "game.html";
            } else {
                errorMsg.textContent = "❌ 合言葉がちがうよ！";
                document.getElementById('password-input').value = "";
            }
        }

        // エンターキー対応
        document.getElementById('password-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
