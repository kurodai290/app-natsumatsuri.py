<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>お祭り！千本引きゲーム</title>
    <style>
        body {
            text-align: center;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #ffde7d;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 450px;
            background-color: #c0392b; /* 赤い幕をイメージ */
            border: 10px solid #f1c40f;
            border-radius: 10px;
            margin: 20px auto;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        /* 紐が隠れている上の幕 */
        #top-curtain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #962d22;
            z-index: 10;
            border-bottom: 5px dashed #f1c40f;
        }
        /* 景品が隠れている下の幕 */
        #bottom-curtain {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            background-color: #2c3e50;
            z-index: 5;
            border-top: 5px solid #34495e;
        }
        #rope-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            height: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }
        .rope-wrapper {
            position: relative;
            width: 40px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* 紐（ひも）の見た目 */
        .rope {
            width: 6px;
            height: 300px;
            background: linear-gradient(90deg, #d7ccc8, #a1887f, #d7ccc8);
            cursor: pointer;
            transition: transform 0.5s ease-in-out;
            transform-origin: top center;
            border-radius: 3px;
            z-index: 2;
        }
        .rope:hover {
            background: linear-gradient(90deg, #ffeb3b, #f57f17, #ffeb3b); /* ホバーで光る */
        }
        /* 紐の先端の結び目 */
        .knot {
            width: 16px;
            height: 16px;
            background-color: #8d6e63;
            border-radius: 50%;
            position: absolute;
            top: 290px;
            cursor: pointer;
            z-index: 3;
            transition: transform 0.5s ease-in-out;
        }
        /* 引っ張られたときのアニメーション用クラス */
        .pulled-rope {
            transform: translateY(-120px); /* 上に引っ張り上げる */
        }
        .pulled-knot {
            transform: translateY(-120px);
        }
        /* 紐にくっついて上がってくる景品 */
        .prize {
            position: absolute;
            bottom: -80px; /* 最初は画面の下に隠れている */
            width: 70px;
            height: 70px;
            background-color: #fff;
            color: #333;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: bottom 0.5s ease-in-out;
            z-index: 1;
            padding: 5px;
            box-sizing: border-box;
        }
        /* 紐が引かれたら景品がせり上がる */
        .pulled-prize {
            bottom: 110px; 
        }
        #result-display {
            font-size: 28px;
            font-weight: bold;
            color: #ff3838;
            height: 40px;
            margin-top: 10px;
        }
        #reset-btn {
            padding: 12px 30px;
            font-size: 18px;
            background-color: #2ed573;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
            margin: 15px auto;
        }
        #reset-btn:hover {
            background-color: #26af5f;
        }
    </style>
</head>
<body>

    <h1>🏮 豪華賞品を当てろ！千本引きゲーム 🏮</h1>
    <p>好きな紐（ひも）を1本選んでクリックしてね！</p>
    
    <div id="game-container">
        <div id="top-curtain"></div>
        <div id="rope-container"></div>
        <div id="bottom-curtain"></div>
    </div>

    <div id="result-display"></div>
    <button id="reset-btn" onclick="initGame()">もう一度引く</button>

    <script>
        const ropeContainer = document.getElementById('rope-container');
        const resultDisplay = document.getElementById('result-display');
        const resetBtn = document.getElementById('reset-btn');

        // 景品のリスト（確率を設定するため多めに用意）
        const prizePool = [
            { name: "特賞🌟<br>ゲーム機", msg: "おめでとう！特賞のゲーム機だ！", color: "#ffd700" },
            { name: "一等一本きり🎯<br>特大花火", msg: "すごい！一等の特大花火セット！", color: "#ff9f43" },
            { name: "二等🧸<br>ぬいぐるみ", msg: "やったね！可愛いぬいぐるみ！", color: "#54a0ff" },
            { name: "三等🍫<br>お菓子詰合せ", msg: "三等！お菓子の詰め合わせだよ", color: "#5fg" }, 
            { name: "残念シュウマイ<br>ハズレポケットティッシュ", msg: "ティッシュでした！次は当たるといいね！", color: "#eeeeee" },
            { name: "残念シュウマイ<br>ハズレポケットティッシュ", msg: "ティッシュでした！次は当たるといいね！", color: "#eeeeee" },
            { name: "残念シュウマイ<br>ハズレポケットティッシュ", msg: "ティッシュでした！次は当たるといいね！", color: "#eeeeee" },
            { name: "残念シュウマイ<br>ハズレポケットティッシュ", msg: "ティッシュでした！次は当たるといいね！", color: "#eeeeee" },
            { name: "残念シュウマイ<br>ハズレポケットティッシュ", msg: "ティッシュでした！次は当たるといいね！", color: "#eeeeee" },
            { name: "残念シュウマイ<br>ハズレポケットティッシュ", msg: "ティッシュでした！次は当たるといいね！", color: "#eeeeee" }
        ];

        let hasPulled = false;

        // ゲームの初期化・紐の生成
        function initGame() {
            ropeContainer.innerHTML = '';
            resultDisplay.textContent = '';
            resetBtn.style.display = 'none';
            hasPulled = false;

            // 景品プールをランダムにシャッフル（どの紐に何があるか分からなくする）
            const shuffledPrizes = [...prizePool].sort(() => Math.random() - 0.5);

            // 10本の紐を作る
            for (let i = 0; i < 10; i++) {
                const wrapper = document.createElement('div');
                wrapper.classList.add('rope-wrapper');

                const rope = document.createElement('div');
                rope.classList.add('rope');

                const knot = document.createElement('div');
                knot.classList.add('knot');

                const prize = document.createElement('div');
                prize.classList.add('prize');
                prize.innerHTML = shuffledPrizes[i].name;
                prize.style.border = `4px solid ${shuffledPrizes[i].color}`;

                wrapper.appendChild(rope);
                wrapper.appendChild(knot);
                wrapper.appendChild(prize);
                ropeContainer.appendChild(wrapper);

                // クリックしたときのイベント（紐か結び目のどちらを押しても反応）
                const pullAction = () => {
                    if (hasPulled) return; // すでに引いていたら反応しない
                    hasPulled = true;

                    // 引いた紐にアニメーション用クラスをつける
                    rope.classList.add('pulled-rope');
                    knot.classList.add('pulled-knot');
                    prize.classList.add('pulled-prize');

                    // 結果を表示
                    setTimeout(() => {
                        resultDisplay.innerHTML = shuffledPrizes[i].msg;
                        resetBtn.style.display = 'block';
                    }, 500); // アニメーションが終わる0.5秒後に表示
                };

                rope.addEventListener('click', pullAction);
                knot.addEventListener('click', pullAction);
            }
        }

        // 最初にゲームを起動
        initGame();
    </script>
</body>
</html>
